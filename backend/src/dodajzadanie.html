<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <nav>
        <a href="">Logowanie</a>
    </nav>
    <main>
        <form action="dodajzadanie.php" method="post">

            <h1>Dodaj zadanie</h1><br>

            <label for="nazwa">Podaj nazwę zadania:</label><br>
            <input type="text" name="nazwa" id="nazwa" required><br><br>

            <div class="form-left">
                <label>Podaj priorytet:</label><br>
                    <input type="radio" name="priorytet" id="niski" value="Niski" required>
                    <label for="niski">Niski</label>

                    <input type="radio" name="priorytet" id="normalny" value="Normalny" required>
                    <label for="normalny">Normalny</label>

                    <input type="radio" name="priorytet" id="wysoki" value="Wysoki" required>
                    <label for="wysoki">Wysoki</label><br><br>

                    <label for="termin">Podaj termin wykonania:</label><br>
                    <input type="date" id="termin" name="termin" required>
            </div>

            <div class="form-right">
                <label for="opis">Podaj opis zadania:</label><br>
                <textarea name="opis" id="opis"></textarea><br><br>
            </div>

            <div class="przeslij">
                <input  type="submit" value="Dodaj zadanie">
            </div>
        </form>
    </main>
</body>
</html>
