parameters:
    mobile_client_id: 'todo-mobile'
    mobile_issuer: ''
    mobile_web_origins: 'http://localhost:3030,http://127.0.0.1:3030'
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: '../src/Kernel.php'
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']
    PDO:
        class: PDO
        factory: ['@App\Service\ConnectionFactory', 'connect']
        arguments:
            - '%env(DB_DSN)%'
            - '%env(DB_USER)%'
            - '%env(DB_PASSWORD)%'
    App\Service\Keycloak:
        arguments:
            $baseUrl: '%env(KEYCLOAK_URL)%'
            $realm: '%env(KEYCLOAK_REALM)%'
            $issuer: '%env(KEYCLOAK_ISSUER)%'
            $clientId: '%env(KEYCLOAK_CLIENT_ID)%'
            $adminUsername: '%env(KEYCLOAK_ADMIN_USERNAME)%'
            $adminPassword: '%env(KEYCLOAK_ADMIN_PASSWORD)%'
            $mfaAcrValues: '%env(KEYCLOAK_MFA_ACR_VALUES)%'
            $frontendOrigin: '%env(FRONTEND_ORIGIN)%'
            $mobileClientId: '%env(default:mobile_client_id:KEYCLOAK_MOBILE_CLIENT_ID)%'
            $mobileIssuer: '%env(default:mobile_issuer:KEYCLOAK_MOBILE_ISSUER)%'
    App\EventSubscriber\ApiSubscriber:
        arguments:
            $allowedOrigin: '%env(CORS_ALLOW_ORIGIN)%'
            $mobileWebOrigins: '%env(default:mobile_web_origins:MOBILE_WEB_ORIGINS)%'
    App\Controller\AuthController:
        arguments:
            $frontendOrigin: '%env(FRONTEND_ORIGIN)%'
    App\Service\TaskFiles:
        arguments:
            $storageDir: '%kernel.project_dir%/var/task_files'
